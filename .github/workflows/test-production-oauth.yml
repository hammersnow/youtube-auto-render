name: Test Production YouTube OAuth
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-production-oauth.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Exchange refresh token and test Analytics read access
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$YOUTUBE_CLIENT_ID" \
            -d client_secret="$YOUTUBE_CLIENT_SECRET" \
            -d refresh_token="$YOUTUBE_REFRESH_TOKEN" \
            -d grant_type=refresh_token)"
          ACCESS_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<<"$TOKEN_JSON")"
          curl -fsS -G -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode 'ids=channel==MINE' \
            --data-urlencode 'startDate=2026-09-01' \
            --data-urlencode 'endDate=2026-09-28' \
            --data-urlencode 'metrics=views' \
            https://youtubeanalytics.googleapis.com/v2/reports \
            -o analytics.json
          python3 - <<'PY'
          import json
          data = json.load(open('analytics.json'))
          if 'error' in data:
              raise SystemExit(data['error'])
          print('PRODUCTION_OAUTH_OK')
          PY
