name: EGI premium Blender V2 native quality benchmark
on:
  push:
    branches: [rd-egi-blender-kokoro-pilot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egi-blender-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    if: github.ref == 'refs/heads/rd-egi-blender-kokoro-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    env:
      EGI_RENDER_MODE: preflight
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official Blender LTS and Kokoro
        run: bash egi_preview/install_blender_v2.sh
      - name: Native 1080p OIDN benchmark and camera anchors
        run: |
          mkdir -p frames preview
          /usr/bin/time -v -o preview/blender-benchmark.txt /tmp/egi-blender/blender -b -t 4 --python-exit-code 1 --python egi_preview/blender_regen_v2.py > blender-render.log 2>&1 || { tail -100 blender-render.log; exit 1; }
          tail -20 blender-render.log
      - name: Compose tracked labels and Kokoro narration
        run: |
          . .venv/bin/activate
          python egi_preview/blender_kokoro_v2.py
          test "$(find preview -name 'v2-frame-*.jpg' | wc -l)" -eq 5
      - name: Native render resource gate (no quality downgrade)
        id: gate
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('preview/preflight.json'))
          estimate=d['estimate_minutes']
          print('480 frame estimate, minutes:',estimate)
          proceed=estimate<=180
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('proceed='+str(proceed).lower()+'\n')
          if not proceed:print('BLOCKED_RENDER_BUDGET: native quality unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egi-blender-v2-native-preflight
          path: |
            preview/
            blender-render.log
          if-no-files-found: warn
          retention-days: 7
  full:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EGI_RENDER_MODE: full
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official Blender LTS and Kokoro
        run: bash egi_preview/install_blender_v2.sh
      - name: Render native 1080x1920 at 30fps, OIDN
        run: |
          mkdir -p frames preview
          /usr/bin/time -v -o preview/blender-benchmark.txt /tmp/egi-blender/blender -b -t 4 --python-exit-code 1 --python egi_preview/blender_regen_v2.py > blender-render.log 2>&1 || { tail -100 blender-render.log; exit 1; }
          test "$(find frames -name 'f_*.png' | wc -l)" -eq 480
      - name: Compose labels, voice and validate output
        run: |
          . .venv/bin/activate
          /usr/bin/time -v -o preview/composite-benchmark.txt python egi_preview/blender_kokoro_v2.py
          ffmpeg -v error -i preview/EGI_Blender_Kokoro_V2.mp4 -f null -
          ffprobe -v error -show_streams -show_format -of json preview/EGI_Blender_Kokoro_V2.mp4 > preview/probe.json
          python - <<'PY'
          import json
          d=json.load(open('preview/probe.json'));v=next(s for s in d['streams'] if s['codec_type']=='video');a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert (v['width'],v['height'],v['avg_frame_rate'],v['codec_name'])==(1080,1920,'30/1','h264')
          assert int(v['nb_frames'])==480 and a['codec_name']=='aac'
          assert abs(float(d['format']['duration'])-16)<.2
          print('NATIVE_30FPS_MEDIA_QA_PASS')
          PY
          for t in 1 5 8 12 15; do
            ffmpeg -v error -ss "$t" -i preview/EGI_Blender_Kokoro_V2.mp4 -frames:v 1 -y "preview/frame-$t.jpg"
          done
          sha256sum preview/EGI_Blender_Kokoro_V2.mp4 > preview/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egi-blender-v2-full-preview
          path: |
            preview/
            blender-render.log
          if-no-files-found: warn
          retention-days: 7
