name: Publish Daily Shorts to YouTube

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Render Daily YouTube Videos"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: daily-youtube-publish
  cancel-in-progress: false

jobs:
  publish:
    # TEMP 2026-09-23: allow one verified V6 push-triggered render to publish.
    # This is reverted immediately after today's five Shorts are scheduled.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"

      - name: Analyze previous performance before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/youtube_analytics_preflight.py

      - name: Download today's rendered Shorts
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/daily-latest"
          curl -fsSL --retry 4 "$BASE/manifest.json" -o manifest.json
          TODAY="$(TZ=Europe/Istanbul date +%F)"
          GOT="$(python3 -c 'import json; print(json.load(open("manifest.json")).get("date",""))')"
          test "$GOT" = "$TODAY" || { echo "Release is stale: $GOT, expected $TODAY"; exit 1; }
          STRATEGY="$(python3 -c 'import json; print(json.load(open("manifest.json")).get("strategy",""))')"
          test "$STRATEGY" = "motion-diversity-v6" || { echo "Refusing non-V6 release: strategy=$STRATEGY"; exit 1; }
          for f in short_1_mesmerizing short_2_optical short_3_rain short_4_loop short_5_experiment; do
            curl -fL --retry 4 "$BASE/$f.mp4" -o "$f.mp4"
          done

      - name: Publish five manifest-driven Shorts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_from_manifest.py
