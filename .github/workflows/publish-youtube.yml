name: Publish Verified EGI Shorts to YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-youtube-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing YouTube OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"

      - name: Download and strictly validate today's EGI manifest and videos
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/egi-daily-latest"
          curl -fsSL --retry 4 "$BASE/manifest.json" -o manifest.json
          TODAY="$(TZ=Europe/Istanbul date +%F)"
          python3 - "$TODAY" <<'PY'
          import json,sys
          m=json.load(open('manifest.json'))
          assert m.get('brand')=='EGI' and m.get('strategy')=='egi-premium-v16'
          assert m.get('publish_enabled') is True
          assert m.get('date')==sys.argv[1], (m.get('date'),sys.argv[1])
          shorts=m.get('shorts',[])
          assert 1<=len(shorts)<=2
          assert len({x['episode_id'] for x in shorts})==len(shorts)
          assert len({x['sha256'] for x in shorts})==len(shorts)
          print('EGI_MANIFEST_PUBLISH_QA_OK:',[x['episode_id'] for x in shorts])
          PY
          python3 -c 'import json; [print(x["file"]) for x in json.load(open("manifest.json"))["shorts"]]' | while IFS= read -r f; do
            [[ "$f" =~ ^EGI_[A-Za-z0-9_]+\.mp4$ ]] || { echo "Unsafe filename: $f"; exit 1; }
            curl -fL --retry 4 "$BASE/$f" -o "$f"
          done

      - name: Publish EGI manifest-driven episodes (duplicate protected)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_egi_from_manifest.py
