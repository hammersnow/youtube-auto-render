name: Publish Daily Shorts to YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-youtube-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"

      - name: Analyze previous performance before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/youtube_analytics_preflight.py

      - name: Download today's premium rendered Shorts
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/daily-latest"
          curl -fsSL --retry 4 "$BASE/manifest.json" -o manifest.json
          TODAY="$(TZ=Europe/Istanbul date +%F)"
          read -r GOT STRATEGY COUNT < <(python3 -c 'import json; m=json.load(open("manifest.json")); print(m.get("date",""),m.get("strategy",""),len(m.get("shorts",[])))')
          test "$GOT" = "$TODAY" || { echo "Release is stale: $GOT, expected $TODAY"; exit 1; }
          test "$STRATEGY" = "premium-motion-v7" || { echo "Refusing non-V7 release: strategy=$STRATEGY"; exit 1; }
          test "$COUNT" = "3" || { echo "Expected 3 premium Shorts, got $COUNT"; exit 1; }

          python3 -c 'import json; [print(x["file"]) for x in json.load(open("manifest.json"))["shorts"]]' | while read -r f; do
            echo "Downloading $f"
            curl -fL --retry 4 "$BASE/$f" -o "$f"
          done

      - name: Publish premium manifest-driven Shorts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_from_manifest.py
