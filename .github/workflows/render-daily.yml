name: Render Daily YouTube Videos

on:
  workflow_dispatch:
  schedule:
    # Multiple off-the-hour windows improve resilience; preflight keeps runs idempotent.
    - cron: '17 0 * * *'  # 03:17 Europe/Istanbul
    - cron: '47 2 * * *'  # 05:47 Europe/Istanbul
    - cron: '17 5 * * *'  # 08:17 Europe/Istanbul
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/render-daily.yml'

permissions:
  contents: write
  actions: write

# Keep production/main and R&D branches isolated so a branch push cannot cancel
# an in-progress daily production render.
concurrency:
  group: daily-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Istanbul
      GH_TOKEN: ${{ github.token }}
      FORCE_RENDER: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[force-render]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python dependencies
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/daily-latest/manifest.json"

          # Keep the currently published manifest before any new render. The V7
          # runtime uses it to avoid repeating yesterday's families. On an explicit
          # same-day repair run it also prevents regenerating the same bad set.
          if curl -fsSL --retry 3 --retry-delay 5 "$MANIFEST_URL" -o previous_manifest.json; then
            CURRENT_DATE="$(python3 -c 'import json; print(json.load(open("previous_manifest.json")).get("date", ""))' 2>/dev/null || true)"
          else
            rm -f previous_manifest.json
            CURRENT_DATE=""
          fi

          # Production schedule/main pushes are idempotent once today's release exists.
          # A manual dispatch or a [force-render] commit explicitly bypasses this guard.
          if [[ "${{ github.event_name }}" == "schedule" && "$CURRENT_DATE" == "$TODAY" && "$FORCE_RENDER" != "true" ]]; then
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Daily release is already current for $TODAY; scheduled render skipped."
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "$CURRENT_DATE" == "$TODAY" && "$FORCE_RENDER" != "true" ]]; then
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Daily release is already current for $TODAY; main push render skipped."
            exit 0
          fi

          echo "render=true" >> "$GITHUB_OUTPUT"
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-opencv python3-numpy python3-pil fonts-dejavu-core

      - name: Run R&D preview smoke tests
        if: steps.preflight.outputs.render == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          previews=(scripts/rd_v7_*_preview.py)
          if (( ${#previews[@]} == 0 )); then
            echo "No R&D preview scripts found."
            exit 0
          fi
          for preview in "${previews[@]}"; do
            echo "Smoke testing $preview"
            python3 "$preview"
          done

      # Full production rendering is main-only. Branch pushes are intentionally
      # preview/smoke-only so R&D and agent PRs cannot burn CPU rendering a full
      # daily batch or accidentally behave like production.
      - name: Render premium V7 Shorts
        if: steps.preflight.outputs.render == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf outputs/latest
          PREVIOUS_MANIFEST=previous_manifest.json python3 scripts/render_premium_v7_runtime.py
          python3 - <<'PY'
          import json
          m=json.load(open('outputs/latest/manifest.json'))
          assert m.get('strategy') == 'premium-motion-v7', m.get('strategy')
          assert len(m.get('shorts', [])) == 3, len(m.get('shorts', []))
          for item in m['shorts']:
              assert item.get('quality_tier') == 'premium-v7'
          prev=set()
          try:
              p=json.load(open('previous_manifest.json'))
              prev={x.get('family') for x in p.get('shorts',[]) if x.get('family')}
          except Exception:
              pass
          cur={x.get('family') for x in m['shorts']}
          if prev and len([x for x in cur if x in prev]) > 1:
              raise SystemExit('Anti-repeat guard failed: previous=%s current=%s' % (sorted(prev), sorted(cur)))
          print('Validated V7 manifest:', [x['family'] for x in m['shorts']])
          PY
          ls -lh outputs/latest

      - name: Create or update public latest release
        if: steps.preflight.outputs.render == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TAG="daily-latest"
          DATE="$(date +%F)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Daily Premium YouTube Render - $DATE" --notes "Three premium procedural Shorts generated for $DATE (Europe/Istanbul)."
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              [[ -z "$asset" ]] || gh release delete-asset "$TAG" "$asset" -y || true
            done
          else
            gh release create "$TAG" --title "Daily Premium YouTube Render - $DATE" --notes "Three premium procedural Shorts generated for $DATE (Europe/Istanbul)."
          fi
          gh release upload "$TAG" outputs/latest/*.mp4 outputs/latest/manifest.json --clobber

      - name: Verify published daily release
        if: steps.preflight.outputs.render == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          URL="https://github.com/${{ github.repository }}/releases/download/daily-latest/manifest.json"
          for attempt in 1 2 3 4 5; do
            read -r PUBLISHED_DATE STRATEGY COUNT < <(
              curl -fsSL --retry 2 --retry-delay 3 "$URL" | python3 -c 'import json,sys; m=json.load(sys.stdin); print(m.get("date",""),m.get("strategy",""),len(m.get("shorts",[])))' 2>/dev/null || true
            )
            if [[ "$PUBLISHED_DATE" == "$TODAY" && "$STRATEGY" == "premium-motion-v7" && "$COUNT" == "3" ]]; then
              exit 0
            fi
            echo "Attempt $attempt: date=${PUBLISHED_DATE:-?} strategy=${STRATEGY:-?} count=${COUNT:-?}"
            sleep 10
          done
          echo "Published V7 manifest verification failed." >&2
          exit 1

      - name: Trigger publisher for new daily release
        if: steps.preflight.outputs.render == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-youtube.yml --ref main
          echo "Publisher dispatched for the new premium daily release."

      - name: Show public asset URLs
        if: steps.preflight.outputs.render == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('outputs/latest/manifest.json'))
          base='https://github.com/${{ github.repository }}/releases/download/daily-latest/'
          for item in m['shorts']:
              print(item['family']+': '+base+item['file'])
          print('Manifest: '+base+'manifest.json')
          PY
