name: EGI V16 Preview QA (NO PUBLISH)

on:
  push:
    branches:
      - egi-v16-preview-20261118
    paths:
      - 'egi_preview/**'
      - '.github/workflows/egi-v16-preview.yml'

permissions:
  contents: read

concurrency:
  group: egi-v16-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Preview branch only; no GitHub releases, OAuth or uploads.
    if: github.ref == 'refs/heads/egi-v16-preview-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Europe/Istanbul
      EGI_OUTPUT_DIR: ${{ github.workspace }}/outputs/egi_v16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free renderer and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'numpy==2.3.5' 'Pillow==12.0.0'
          mkdir -p "$EGI_OUTPUT_DIR"
          python -m compileall -q egi_preview

      - name: All categories source/semantic QA (no publishing)
        run: python egi_preview/qa_v16.py

      - name: Render named-resource V16 full software pilot + technology storyboard
        shell: bash
        run: |
          set -euo pipefail
          python egi_preview/egi_v16_rich_resources.py --mode software
          python egi_preview/egi_v16_rich_resources.py --mode technology --preview

      - name: Verify MP4 codec, dimensions, FPS, audio, duration, and preview
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$EGI_OUTPUT_DIR/EGI_V16_Software_HTML_CSS_JavaScript_Rich_Animation.mp4"
          export VIDEO
          python - <<'PY'
          import os, json, subprocess
          path=os.environ['VIDEO']
          data=json.loads(subprocess.check_output([
             'ffprobe','-v','error','-show_streams','-show_format','-of','json',path
          ]))
          streams=data['streams']
          videos=[s for s in streams if s['codec_type']=='video']
          audios=[s for s in streams if s['codec_type']=='audio']
          assert len(videos)==1 and len(audios)==1, (videos,audios)
          v,a=videos[0],audios[0]
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate']) == ('h264',1080,1920,'30/1'),v
          assert a['codec_name']=='aac',a
          assert abs(float(data['format']['duration'])-36)<.12,data['format']
          assert os.path.getsize(path)>100000
          for stem in ('Software_HTML_CSS_JavaScript_Rich_Animation','Technology_One_Event_One_Callout'):
              p=os.path.join(os.environ['EGI_OUTPUT_DIR'],'EGI_V16_'+stem+'_Storyboard.jpg')
              assert os.path.isfile(p) and os.path.getsize(p)>10000,p
          print('EGI_V16_FULL_RENDER_QA_PASS',os.path.getsize(path))
          PY

      - name: Preserve QA-only artifacts; never release or publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egi-v16-pilot-preview
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/egi_v16/*.mp4
            outputs/egi_v16/*_Storyboard.jpg
